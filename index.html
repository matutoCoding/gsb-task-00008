<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>岸桥—集卡联动估算台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Quay Crane × Truck × Yard</p>
      <h1>岸桥—集卡联动估算台</h1>
      <p class="subtitle">任一条件变化后，重算所有作业线、集卡等待和两边堆场拥堵。</p>
    </div>
    <div class="top-actions">
      <span id="savedAt" class="saved-pill">尚未保存</span>
      <button id="resetBtn" class="btn btn-ghost" type="button">恢复演示数据</button>
    </div>
  </header>

  <main>
    <section class="notice-stack" id="noticeStack"></section>

    <section class="global-card" aria-label="全局条件">
      <div class="control">
        <label for="fleetTotal">在港可用集卡（辆）</label>
        <input id="fleetTotal" type="number" min="0" step="1">
      </div>
      <div class="control control-wide">
        <label for="weatherFactor">天气/视线效率：<strong id="weatherValue">100%</strong></label>
        <input id="weatherFactor" type="range" min="0.5" max="1.15" step="0.01">
      </div>
      <div class="control">
        <label for="baseCycle">单车基础往返（分钟）</label>
        <input id="baseCycle" type="number" min="4" step="1">
      </div>
      <div class="control">
        <label for="horizonHours">估算时长（小时）</label>
        <input id="horizonHours" type="number" min="1" step="1">
      </div>
      <button id="addLineBtn" class="btn btn-primary" type="button">＋ 临时加线</button>
    </section>

    <section class="kpi-grid" id="globalKpis"></section>

    <section class="section-head">
      <div>
        <h2>作业线</h2>
        <p>速度、车辆、实际进度和故障状态放在同一张线卡内。</p>
      </div>
    </section>
    <section class="line-grid" id="lineGrid"></section>

    <section class="section-head">
      <div>
        <h2>两侧堆场</h2>
        <p>堆场服务能力与堆存占用会反向增加集卡往返时间。</p>
      </div>
    </section>
    <section class="yard-grid" id="yardGrid"></section>
  </main>

  <dialog id="planDialog" class="dialog">
    <form method="dialog">
      <div class="dialog-head">
        <div>
          <p class="eyebrow" id="planEyebrow">方案比选</p>
          <h2 id="planTitle">集卡调整方案</h2>
          <p id="planDescription"></p>
        </div>
        <button class="icon-btn" value="cancel" aria-label="关闭">×</button>
      </div>
      <div class="target-row">
        <label for="planTarget">目标集卡数</label>
        <input id="planTarget" type="number" min="0" step="1">
      </div>
      <div id="planList" class="plan-list"></div>
      <menu>
        <button value="cancel" class="btn btn-ghost">取消</button>
      </menu>
    </form>
  </dialog>

  <template id="lineTemplate">
    <article class="line-card">
      <div class="line-card-head">
        <div>
          <div class="line-title-row">
            <h3></h3>
            <span class="badge temp-badge hidden">临时线</span>
            <span class="badge down-badge hidden">岸桥停机</span>
          </div>
          <p class="muted line-subhead"></p>
        </div>
        <label class="switch">
          <input data-field="broken" type="checkbox">
          <span>故障</span>
        </label>
      </div>

      <div class="status-pill"></div>
      <div class="progress-track" aria-label="进度">
        <div class="progress-bar"></div>
        <div class="progress-forecast"></div>
      </div>

      <div class="metric-grid">
        <div><span>估算速度</span><strong class="m-eff"></strong></div>
        <div><span>还需时间</span><strong class="m-eta"></strong></div>
        <div><span>车辆匹配</span><strong class="m-cover"></strong></div>
        <div><span>岸边等待</span><strong class="m-wait"></strong></div>
      </div>

      <div class="input-grid">
        <label>岸桥速度（箱/小时）<input data-field="qcRate" type="number" min="0" step="0.5"></label>
        <label>已分配集卡（辆）<input data-field="trucks" type="number" min="0" step="1"></label>
        <label>剩余箱量（箱）<input data-field="remaining" type="number" min="0" step="1"></label>
        <label>已完成（箱）<input data-field="completed" type="number" min="0" step="1"></label>
        <label>已运行（小时）<input data-field="elapsed" type="number" min="0" step="0.1"></label>
        <label>
          目标堆场
          <select data-field="yard">
            <option value="A">A 堆场</option>
            <option value="B">B 堆场</option>
          </select>
        </label>
      </div>

      <details class="calibration">
        <summary>实际进度对不上，修正后续估算</summary>
        <div class="calibration-body">
          <p class="muted">输入一段实际运行结果，只折算后续效率，不清空前序进度。</p>
          <label>这段实际运行（小时）<input data-cal="hours" type="number" min="0.1" step="0.1"></label>
          <label>这段实际完成（箱）<input data-cal="moves" type="number" min="0" step="1"></label>
          <button type="button" class="btn btn-secondary calibrate-btn">应用修正</button>
          <button type="button" class="btn btn-ghost reset-cal-btn">取消修正</button>
          <p class="cal-note"></p>
        </div>
      </details>

      <div class="line-actions">
        <button type="button" class="btn btn-secondary repair-btn hidden">修好并回流车辆</button>
        <button type="button" class="btn btn-ghost remove-btn hidden">移除临时线</button>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
